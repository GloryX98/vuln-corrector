name: build-binaries

# Builds a native standalone executable on each OS (PyInstaller cannot
# cross-compile, so each binary is built on its own runner).
#   * every push to main  -> binaries uploaded as downloadable workflow artifacts
#   * a version tag (v*)   -> a GitHub Release is created with all three binaries
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: vuln_corrector-windows-x64.exe
            ext: .exe
          - os: macos-latest
            asset: vuln_corrector-macos-arm64
            ext: ''
          - os: ubuntu-latest
            asset: vuln_corrector-linux-x64
            ext: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        run: python -m pip install --upgrade pip pyinstaller openpyxl

      - name: Build binary
        run: pyinstaller --onefile --console --name vuln_corrector --collect-all openpyxl launch.py

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          cp "dist/vuln_corrector${{ matrix.ext }}" "out/${{ matrix.asset }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset }}
